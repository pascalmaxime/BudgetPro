name: budget_pro
description: "Application de gestion budgétaire personnelle"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.0

  # Base de données locale
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4
  path_provider: ^2.1.5
  path: ^1.9.1

  # Notifications locales
  flutter_local_notifications: ^18.0.1

  # IA (Claude Haiku via HTTP)
  http: ^1.2.2

  # Import/Export Excel
  excel: ^4.0.6

  # Sélecteur de fichiers (import)
  file_picker: ^8.1.2

  # Utilitaires
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.0
  timezone: ^0.10.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
